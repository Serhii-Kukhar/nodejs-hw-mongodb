openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts Book API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This API allows users to register, log in, and manage their personal contact list with names, phone numbers, and optional images.
tags:
  - name: Contacts
    description: Operations about users.
  - name: Auth
    description: Auth operations.

servers:
  - url: http://localhost:3000
  - url: https://swagger-cl30.onrender.com/

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{id}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
